[pytest]
# Add the backend/ rootdir to sys.path so `import app` works regardless of how
# pytest is invoked (plain `pytest` does not add CWD; `python -m pytest` does).
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
